<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Eazily verification code</title></head>
  <body style="margin:0;padding:24px;background:#f5f6f8;color:#111318;font-family:Arial,sans-serif;line-height:1.6">
    <main style="max-width:480px;margin:auto;padding:28px;background:#ffffff;border-radius:16px">
      <h1 style="margin-top:0;font-size:26px">Your Eazily code</h1>
      <p>Enter this code in Eazily to verify your email and continue:</p>
      <p style="padding:16px;background:#f5f6f8;text-align:center;font-size:28px;letter-spacing:4px;font-weight:bold">{{ .Token }}</p>
      <p>Use the latest code. Never share it with anyone.</p>
      <p style="color:#4a5261">If you did not request this code, you can ignore this email.</p>
    </main>
  </body>
</html>
